 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nepal ko Itihas - History Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="quiz-card">
    <!-- Welcome Screen -->
    <div id="screen-welcome" class="screen active">
      <h2>Nepal ko Itihas</h2>
      <p>Test your knowledge of key milestones in Nepali history.</p>
      <button class="btn-primary" onclick="startQuiz()">Start Quiz</button>
    </div>

    <!-- Quiz Screen -->
    <div id="screen-quiz" class="screen">
      <div class="progress-bar">
        <span id="question-progress">Question 1 of 5</span>
        <div class="progress-bar-track">
          <div id="progress-bar-fill"></div>
        </div>
      </div>
      
      <h3 id="question-text"></h3>
      <div id="options-container"></div>
      
      <div id="explanation-box" style="display:none;">
        <span id="explanation-text"></span>
      </div>
      
      <button id="btn-next" class="btn-primary" onclick="nextQuestion()" style="display:none;">Next Question</button>
    </div>

    <!-- Results Screen -->
    <div id="screen-results" class="screen">
      <h2>Quiz Completed!</h2>
      <div id="final-score"></div>
      <div id="review-container"></div>
      <button class="btn-primary" onclick="startQuiz()">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
